<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3M — Rented Machines</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <meta name="theme-color" content="#0B1210">
  <style>
    .rented-hero { text-align:left; }
    .rented-hero h1 { font-size:1.7rem; margin:6px 0; }
    .rented-hero p { color:var(--muted); font-size:.84rem; line-height:1.5; }
    .rented-card { padding:20px; margin-bottom:14px; overflow:hidden; }
    .rented-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .rented-name { font-family:var(--font-display); font-weight:800; font-size:1rem; }
    .rented-meta { margin-top:4px; color:var(--muted); font-size:.73rem; }
    .rented-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0 14px; }
    .rented-stat { padding:10px 6px; text-align:center; border-radius:12px; background:rgba(255,255,255,.55); border:1px solid rgba(16,185,129,.14); }
    .rented-stat b { display:block; font-family:var(--font-display); font-size:.82rem; color:var(--primary-2); }
    .rented-stat.gold b { color:var(--gold); }
    .rented-stat span { display:block; margin-top:4px; color:var(--muted); font-size:.61rem; font-weight:700; text-transform:uppercase; }
    .machine-progress { height:8px; overflow:hidden; border-radius:999px; background:rgba(85,116,101,.14); }
    .machine-progress span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#6EE7B7,#10B981,#047857); }
    .rented-foot { display:flex; justify-content:space-between; gap:10px; margin-top:9px; color:var(--muted); font-size:.7rem; }
  </style>
</head>
<body>
  <div id="header-container"></div>
  <main class="page">
    <section class="hero-card rented-hero"><span class="eyebrow" style="color:var(--primary);font-size:.65rem;letter-spacing:.14em;font-weight:800;">NORTHSTAR / ACTIVE EQUIPMENT</span><h1>Rented Machines</h1><p>Your rented machines pay automatically. There is no daily task and no manual claim button. Keep the account funded and check back after the next 24-hour cycle.</p><a href="/membership.html" class="btn btn-primary btn-sm" style="margin-top:16px;"><i class="fa-solid fa-industry"></i> Rent another machine</a></section>
    <div class="section-title"><i class="fa-solid fa-briefcase"></i> My rented packages</div>
    <div id="rented-list"><div class="empty-state"><i class="fa-solid fa-circle-notch spinner"></i>Loading rented machines...</div></div>
  </main>
  <div id="footer-container"></div>
  <script src="/assets/js/notifications.js"></script>
  <script type="module" src="/assets/js/components.js"></script>
  <script type="module">
    import { requireAuth, supabase } from '/assets/js/auth-guard.js';
    await requireAuth();
    const token = async () => (await supabase.auth.getSession()).data.session.access_token;
    const money = (value) => `₦${Number(value || 0).toLocaleString('en-NG')}`;
    const list = document.getElementById('rented-list');
    const dateTime = (value) => value ? new Date(value).toLocaleString('en-NG', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }) : '—';
    async function load() {
      try {
        const res = await fetch('/api/mining-machines?action=getRented', { headers: { Authorization: `Bearer ${await token()}` } });
        const data = await res.json(); if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
        if (!data.rented.length) { list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-briefcase"></i>No rented machines yet. Choose a package to get started.</div>'; return; }
        list.innerHTML = data.rented.map((machine) => {
          const start = new Date(machine.purchase_time || machine.created_at).getTime();
          const end = new Date(machine.ends_at || `${machine.end_date}T23:59:59Z`).getTime();
          const progress = Math.max(0, Math.min(100, ((Date.now() - start) / Math.max(1, end - start)) * 100));
          const active = machine.status === 'active';
          return `<article class="card rented-card"><div class="rented-top"><div><div class="rented-name">${machine.wealth_packages?.name || 'Mining Machine'}</div><div class="rented-meta">Purchased ${dateTime(machine.purchase_time || machine.created_at)}</div></div><span class="badge ${active ? 'badge-mint' : 'badge-gray'}">${active ? 'Active' : 'Completed'}</span></div><div class="rented-stats"><div class="rented-stat"><b>${money(machine.amount)}</b><span>Invested</span></div><div class="rented-stat gold"><b>${money(machine.daily_return)}</b><span>Daily income</span></div><div class="rented-stat"><b>${money(machine.total_earned)}</b><span>Earned so far</span></div></div><div class="machine-progress"><span style="width:${progress}%"></span></div><div class="rented-foot"><span>${active ? `Next income ${dateTime(machine.next_income_at)}` : 'Rental cycle complete'}</span><span>Ends ${dateTime(machine.ends_at || machine.end_date)}</span></div></article>`;
        }).join('');
      } catch (error) { list.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>${error.message}<br><button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="location.reload()">Retry</button></div>`; }
    }
    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
