<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APM — Task Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <meta name="theme-color" content="#0B1210">
  <style>
    .streak-card {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(135deg, #241A06, #1A2C24);
      border: 1px solid rgba(245,197,24,.3);
      border-radius: 20px; padding: 18px 20px; margin-bottom: 20px;
    }
    .streak-left { display: flex; align-items: center; gap: 14px; }
    .flame { font-size: 2rem; filter: drop-shadow(0 0 12px rgba(255,140,0,.6)); }
    .streak-num { font-family: 'Sora'; font-size: 1.4rem; font-weight: 800; color: var(--gold); }
    .streak-lbl { font-size: .75rem; color: var(--muted); font-weight: 600; }
    .today-earn { text-align: right; }
    .today-earn b { font-family: 'Sora'; font-size: 1.2rem; color: var(--primary); display: block; }
    .today-earn span { font-size: .72rem; color: var(--muted); font-weight: 600; }
    .claim-btn {
      padding: 10px 16px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #00B877);
      color: #04110B; font-weight: 800; font-size: .82rem; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,224,138,.3); white-space: nowrap;
      transition: transform .12s;
    }
    .claim-btn:active { transform: scale(.94); }
    .claim-btn:disabled { background: var(--surface-2); color: var(--muted); box-shadow: none; cursor: not-allowed; }
    .claim-btn.done { background: rgba(0,224,138,.12); color: var(--primary); border: 1px solid rgba(0,224,138,.35); }
    .coin-particle {
      position: fixed; z-index: 99999; pointer-events: none;
      color: var(--gold); font-size: 1.05rem;
      animation: coin-fly .8s ease-out forwards;
      text-shadow: 0 0 10px rgba(245,197,24,.7);
    }
    @keyframes coin-fly {
      to { transform: translate(var(--dx), var(--dy)) scale(.3) rotate(260deg); opacity: 0; }
    }
    .reward-pop {
      position: fixed; z-index: 99999; pointer-events: none;
      font-family: 'Sora'; font-weight: 800; color: var(--primary); font-size: 1.2rem;
      text-shadow: 0 0 16px rgba(0,224,138,.6);
      animation: pop-up .9s ease-out forwards;
    }
    @keyframes pop-up {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-70px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <div class="page">
    <h1 class="page-title">Task Center</h1>
    <p class="page-sub">Tap. Claim. Get paid. New tasks daily.</p>

    <div class="streak-card">
      <div class="streak-left">
        <span class="flame">🔥</span>
        <div>
          <div class="streak-num" id="streak-num">0 days</div>
          <div class="streak-lbl">Claim streak — keep it alive!</div>
        </div>
      </div>
      <div class="today-earn">
        <b id="today-earned">₦0</b>
        <span>Earned today</span>
      </div>
    </div>

    <div class="section-title"><i class="fa-solid fa-hand-pointer"></i> Today's Tasks</div>
    <div id="task-list">
      <div class="empty-state"><i class="fa-solid fa-circle-notch spinner"></i>Loading tasks...</div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module" src="/assets/js/components.js"></script>
  <script type="module">
    import { requireAuth } from '/assets/js/auth-guard.js';
    await requireAuth();

    const token = async () => (await supabase.auth.getSession()).data.session.access_token;

    async function loadTasks() {
      const res = await fetch('/api/tasks?action=getTasks', { headers: { Authorization: `Bearer ${await token()}` } });
      const data = await res.json();
      if (!res.ok) { showToast(data.error, 'error'); return; }

      document.getElementById('streak-num').textContent = `${data.streak} day${data.streak === 1 ? '' : 's'}`;
      document.getElementById('today-earned').textContent = `₦${Number(data.today_earned).toLocaleString()}`;

      const list = document.getElementById('task-list');
      if (!data.tasks.length) {
        list.innerHTML = '<div class="empty-state"><i class="fa-solid fa-inbox"></i>No tasks available right now. Check back soon!</div>';
        return;
      }

      list.innerHTML = data.tasks.map(t => {
        let btn;
        if (t.locked) {
          btn = `<button class="claim-btn" disabled><i class="fa-solid fa-lock"></i> ${t.min_tier}</button>`;
        } else if (t.claimed_today) {
          btn = `<button class="claim-btn done" disabled><i class="fa-solid fa-check"></i> Claimed</button>`;
        } else {
          btn = `<button class="claim-btn" onclick="claimTask('${t.id}', this)">Claim ₦${t.reward_amount.toLocaleString()}</button>`;
        }
        return `
          <div class="task-card ${t.locked ? 'locked' : ''} ${t.claimed_today ? 'claimed' : ''}" id="card-${t.id}">
            <div class="task-icon"><i class="${t.icon}"></i></div>
            <div class="task-info">
              <div class="task-title">${t.title}</div>
              <div class="task-desc">${t.description || ''}</div>
            </div>
            ${btn}
          </div>`;
      }).join('');
    }

    // Coin burst + floating reward text
    function celebrate(x, y, amount) {
      for (let i = 0; i < 12; i++) {
        const c = document.createElement('span');
        c.className = 'coin-particle';
        c.innerHTML = '<i class="fa-solid fa-coins"></i>';
        const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
        const dist = 60 + Math.random() * 70;
        c.style.left = x + 'px';
        c.style.top = y + 'px';
        c.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        c.style.setProperty('--dy', Math.sin(angle) * dist - 30 + 'px');
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 850);
      }
      const pop = document.createElement('span');
      pop.className = 'reward-pop';
      pop.textContent = `+₦${amount.toLocaleString()}`;
      pop.style.left = x - 30 + 'px';
      pop.style.top = y - 20 + 'px';
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 950);
    }

    window.claimTask = async (taskId, btn) => {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch spinner"></i>';

      const res = await fetch('/api/tasks?action=claimTask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await token()}` },
        body: JSON.stringify({ task_id: taskId })
      });
      const data = await res.json();

      if (!res.ok) {
        showToast(data.error, 'error');
        btn.disabled = false;
        btn.textContent = 'Claim';
        return;
      }

      // Celebrate at button position
      const rect = btn.getBoundingClientRect();
      celebrate(rect.left + rect.width / 2, rect.top + rect.height / 2, data.amount);

      btn.className = 'claim-btn done';
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Claimed';
      document.getElementById(`card-${taskId}`)?.classList.add('claimed');

      showToast(`+₦${data.amount.toLocaleString()} claimed! 🔥 ${data.streak}-day streak`, 'gold');

      // Refresh streak + today's earnings + header balance
      loadTasks();
      window.APMShell?.refresh();
    };

    loadTasks();
  </script>
</body>
</html>
