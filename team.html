<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0033CC" />
  <title>My Team - Calmtel Network International</title>
  <link rel="stylesheet" href="/assets/css/cni.css" />
</head>
<body>
  <div id="app-header"></div>
  
  <div class="wrap">
    <!-- Loading State -->
    <div id="loadingState" style="text-align:center;padding:40px;color:var(--cni-mut);">
      👥 Loading your network...
    </div>

    <!-- Main Content -->
    <div id="mainContent" style="display:none;">
      
      <!-- Stats Grid -->
      <div class="stats rise d1">
        <div class="stat"><b id="tMembers">0</b><span>Total Members</span></div>
        <div class="stat"><b class="cyan" id="tActive">0</b><span>Active Investors</span></div>
        <div class="stat"><b class="gold" id="tEarn">0</b><span>Earned (30%)</span></div>
      </div>

      <!-- Referral Card -->
      <div class="card glow rise d2">
        <div class="sec" style="margin-top:0;">Your Invite Kit</div>
        
        <label class="lbl">Referral Code</label>
        <div class="row" style="margin-bottom:10px;">
          <input class="input grow" id="refCodeInput" readonly value="—" style="margin-bottom:0;font-weight:900;color:var(--cni-cyan);" />
          <button class="btn sm cyan" onclick="copyCode()" style="flex:none;margin-left:8px;">📋 Code</button>
        </div>

        <label class="lbl">Direct Sign-Up Link</label>
        <div class="row">
          <input class="input grow" id="refLinkInput" readonly value="—" style="margin-bottom:0;font-size:11px;" />
          <button class="btn sm primary" onclick="copyLink()" style="flex:none;margin-left:8px;">🔗 Link</button>
        </div>

        <div class="mut" style="font-size:11px;margin-top:10px;text-align:center;">
          Share either to earn <strong>30% commission</strong> on every deposit your friends make!
        </div>
      </div>

      <!-- Downline List -->
      <div class="sec rise d3">Downline Members</div>
      <div id="tList"></div>
    </div>
  </div>
  
  <div id="app-footer"></div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/supabase.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    const fmt = n => Number(n || 0).toLocaleString() + ' FCFA';
    let SESSION = null;
    let UID = null;
    let CODE = '';
    let LINK = '';

    document.addEventListener('DOMContentLoaded', async function () {
      // 1. GET SESSION
      SESSION = await CniAuth.requireAuth();
      if (!SESSION) return;
      
      UID = SESSION.user.id;
      console.log('[TEAM] Session loaded for:', UID);

      try {
        // 2. FETCH PROFILE FOR HEADER (Self-Heal if missing)
        const { data: profile } = await window.sb.from('users').select('*').eq('id', UID).single();
        
        // Render Header & Nav immediately
        CniUI.header(SESSION, profile);
        CniUI.nav();

        // 3. CALL SECURE RPC FUNCTION TO GET TEAM DATA
        const { data: teamData, error } = await window.sb.rpc('get_team', { p_uid: UID });

        if (error || !teamData || teamData.error) {
          console.error('[TEAM] RPC Error:', error || teamData);
          throw new Error(error?.message || 'Failed to load team statistics.');
        }

        // Populate Stats
        CODE = teamData.referral_code || 'N/A';
        LINK = location.origin + '/register?ref=' + CODE;
        
        document.getElementById('tCode').textContent = CODE; // Fallback display
        document.getElementById('refCodeInput').value = CODE;
        document.getElementById('refLinkInput').value = LINK;
        
        document.getElementById('tMembers').textContent = teamData.total_downlines || 0;
        document.getElementById('tActive').textContent = teamData.active_downlines || 0;
        document.getElementById('tEarn').textContent = Number(teamData.referral_earnings || 0).toLocaleString();

        // Render Member Cards
        const members = teamData.members || [];
        const listContainer = document.getElementById('tList');

        if (members.length === 0) {
          listContainer.innerHTML = `
            <div class="empty">
              No team members yet.<br>
              Share your invite link above to start earning passive income!<br><br>
              <button class="btn sm cyan" onclick="shareWA()">💬 Share on WhatsApp</button>
            </div>`;
        } else {
          listContainer.innerHTML = members.map(m => `
            <div class="card" style="padding:12px 14px;margin-bottom:8px;">
              <div class="row">
                <div class="av" style="width:40px;height:40px;font-size:16px;">${(m.full_name || '?').charAt(0).toUpperCase()}</div>
                <div class="grow">
                  <div class="name" style="font-size:13px;">${m.full_name || 'Unnamed Member'}</div>
                  <div class="mut" style="font-size:10px;">Joined ${new Date(m.created_at).toLocaleDateString()}<br>Deposited: ${fmt(m.total_deposit)} • Invested: ${fmt(m.invested)}</div>
                </div>
                <div class="right">
                  <div class="amt gold" style="font-size:13px;">+${fmt(m.commission)}</div>
                  <span class="chip ${m.active_plans > 0 ? 'active' : 'completed'}" style="font-size:9px;">${m.active_plans > 0 ? 'ACTIVE PLAN' : 'NO ACTIVE PLAN'}</span>
                </div>
              </div>
            </div>`).join('');
        }

        // Show Content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

      } catch (err) {
        console.error('[TEAM] Critical Error:', err);
        document.getElementById('loadingState').innerHTML = 
          `<div style="color:var(--cni-red);">❌ Failed to load team page.<br>${err.message}</div>`;
      }
    });

    // --- COPY FUNCTIONS ---
    function copyCode() {
      if (!CODE || CODE === 'N/A') return showToast('No code available', 'error');
      navigator.clipboard.writeText(CODE).then(() => {
        showToast('✅ Code copied: ' + CODE, 'success');
      }).catch(() => {
        // Fallback for older browsers
        document.getElementById('refCodeInput').select();
        document.execCommand('copy');
        showToast('✅ Code copied!', 'success');
      });
    }

    function copyLink() {
      if (!LINK || LINK.includes('N/A')) return showToast('No link available', 'error');
      navigator.clipboard.writeText(LINK).then(() => {
        showToast('✅ Link copied!', 'success');
      }).catch(() => {
        document.getElementById('refLinkInput').select();
        document.execCommand('copy');
        showToast('✅ Link copied!', 'success');
      });
    }

    function shareWA() {
      if (!CODE || CODE === 'N/A') return;
      const text = encodeURIComponent(
        `🌐 Join me on CALMTEL NETWORK INTERNATIONAL!\n\nInvest & earn 32.5% daily for 15 days.\nUse my exclusive invite code: ${CODE}\n\nSign up here: ${LINK}`
      );
      window.open('https://wa.me/?text=' + text, '_blank');
    }

    function showToast(msg, type) {
      CniAuth.toast(msg, type);
    }
  </script>
</body>
</html>
