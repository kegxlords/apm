<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>APM — My Team</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <meta name="theme-color" content="#0B1210">
  <style>
    .ref-card { background: linear-gradient(135deg, #241A06, #1A2C24); border: 1px solid rgba(245,197,24,.35); border-radius: 24px; padding: 24px; text-align: center; margin-bottom: 20px; }
    .ref-label { font-size: .78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .ref-code { font-family: 'Sora'; font-size: 2rem; font-weight: 800; color: var(--gold); letter-spacing: 4px; margin: 10px 0 16px; text-shadow: 0 0 24px rgba(245,197,24,.35); }
    .share-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .member-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .member-row:last-child { border-bottom: none; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-dim); color: var(--primary); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-weight: 700; font-size: .9rem; }
    .member-email { font-size: .72rem; color: var(--muted); }
  </style>
</head>
<body>
  <div id="header-container"></div>
  <div class="page">
    <h1 class="page-title">My Team</h1>
    <p class="page-sub">Invite friends. Earn <span class="gold" id="comm-pct">10</span>% on every deposit they make.</p>

    <div class="ref-card">
      <div class="ref-label">Your Referral Code</div>
      <div class="ref-code" id="ref-code">—</div>
      <div class="share-row">
        <button class="btn btn-primary btn-sm" onclick="copyLink()"><i class="fa-regular fa-copy"></i> Copy Invite Link</button>
        <button class="btn btn-ghost btn-sm" onclick="shareWhatsApp()"><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>
        <button class="btn btn-ghost btn-sm" onclick="shareTelegram()"><i class="fa-brands fa-telegram"></i> Telegram</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="stat-team">0</div><div class="stat-label">Team Members</div></div>
      <div class="stat-card"><div class="stat-value gold" id="stat-commissions">₦0</div><div class="stat-label">Commissions Earned</div></div>
    </div>

    <div class="section-title"><i class="fa-solid fa-users"></i> My Team Members</div>
    <div class="card" id="team-list"><div class="empty-state"><i class="fa-solid fa-circle-notch spinner"></i>Loading...</div></div>

    <div class="section-title"><i class="fa-solid fa-coins"></i> Commission Earnings</div>
    <div class="card" id="comm-list"><div class="empty-state"><i class="fa-solid fa-circle-notch spinner"></i>Loading...</div></div>
  </div>
  <div id="footer-container"></div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module" src="/assets/js/components.js"></script>
  <script type="module">
    import { requireAuth, supabase } from '/assets/js/auth-guard.js';
    const user = await requireAuth();

    const [profileR, settingsR, teamR, commR] = await Promise.all([
      supabase.from('profiles').select('referral_code').eq('id', user.id).single(),
      supabase.from('site_settings').select('value').eq('key', 'referral_commission_percentage').single(),
      supabase.from('profiles').select('full_name, email, tier, created_at').eq('referred_by', user.id).order('created_at', { ascending: false }),
      supabase.from('referral_commissions').select('commission_amount, created_at').eq('referrer_id', user.id).order('created_at', { ascending: false }).limit(30)
    ]);

    const code = profileR.data?.referral_code || '—';
    const inviteLink = `${location.origin}/register.html?ref=${code}`;
    document.getElementById('ref-code').textContent = code;
    document.getElementById('comm-pct').textContent = settingsR.data?.value || '10';

    window.copyLink = () => { navigator.clipboard.writeText(inviteLink); showToast('Invite link copied!', 'success'); };
    window.shareWhatsApp = () => {
      const msg = encodeURIComponent(`Join me on APM and start earning daily! Use my code ${code} to sign up: ${inviteLink}`);
      open(`https://wa.me/?text=${msg}`, '_blank');
    };
    window.shareTelegram = () => {
      const msg = encodeURIComponent(`Join me on APM and start earning daily! Use my code ${code}: ${inviteLink}`);
      open(`https://t.me/share/url?url=${encodeURIComponent(inviteLink)}&text=${msg}`, '_blank');
    };

    // Stats
    document.getElementById('stat-team').textContent = teamR.count ?? (teamR.data || []).length;
    const totalComm = (commR.data || []).reduce((s, r) => s + Number(r.commission_amount), 0);
    document.getElementById('stat-commissions').textContent = `₦${totalComm.toLocaleString()}`;

    // Team list (emails masked)
    const mask = (email) => {
      const [n, d] = email.split('@');
      return `${n[0] || '*'}***@${d || '***'}`;
    };
    const teamBox = document.getElementById('team-list');
    if (!(teamR.data || []).length) {
      teamBox.innerHTML = '<div class="empty-state"><i class="fa-solid fa-user-plus"></i>No team members yet. Share your link!</div>';
    } else {
      teamBox.innerHTML = teamR.data.map(m => `
        <div class="member-row">
          <div class="avatar">${(m.full_name || '?')[0].toUpperCase()}</div>
          <div class="member-info">
            <div class="member-name">${m.full_name || 'Member'}</div>
            <div class="member-email">${mask(m.email || '')} • joined ${new Date(m.created_at).toLocaleDateString()}</div>
          </div>
          <span class="badge ${m.tier !== 'A0' ? 'badge-gold' : 'badge-gray'}">${m.tier}</span>
        </div>`).join('');
    }

    // Commissions list
    const commBox = document.getElementById('comm-list');
    if (!(commR.data || []).length) {
      commBox.innerHTML = '<div class="empty-state"><i class="fa-solid fa-coins"></i>No commissions yet. Earn when your team deposits.</div>';
    } else {
      commBox.innerHTML = commR.data.map(c => `
        <div class="list-row">
          <div><b class="mint">+₦${Number(c.commission_amount).toLocaleString()}</b>
          <div class="muted" style="font-size:.72rem;">${new Date(c.created_at).toLocaleString('en-NG', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div></div>
          <span class="badge badge-mint">paid</span>
        </div>`).join('');
    }
  </script>
</body>
</html>
