<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APM — Create Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <meta name="theme-color" content="#0B1210">
  <style>
    body { padding-bottom: 0; }
    .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .auth-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 32px 26px; box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    .auth-logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Sora'; font-weight: 800; font-size: 1.5rem; }
    .auth-logo .coin { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(135deg, var(--primary), #00A86B); display: grid; place-items: center; color: #04110B; font-size: 1.3rem; box-shadow: 0 0 24px rgba(0,224,138,.4); }
    .auth-logo .bolt { color: var(--gold); }
    .auth-title { text-align: center; font-size: 1.3rem; font-weight: 800; margin: 16px 0 4px; }
    .auth-sub { text-align: center; color: var(--muted); font-size: .88rem; margin-bottom: 24px; }
    .auth-switch { text-align: center; margin-top: 18px; font-size: .88rem; color: var(--muted); }
    .auth-switch a { color: var(--primary); font-weight: 700; text-decoration: none; }
    .ref-hint { font-size: .75rem; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><span class="coin">A</span> APM<span class="bolt">⚡</span></div>
      <div class="auth-title">Create your account</div>
      <div class="auth-sub">Free to join • Start claiming today</div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="full-name" class="input" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="input" placeholder="Min. 6 characters" minlength="6" required>
        </div>
        <div class="form-group">
          <label class="form-label">Referral Code <span class="muted">(optional)</span></label>
          <input type="text" id="referral-code" class="input" placeholder="e.g. A1B2C3D4" maxlength="8" style="text-transform: uppercase;">
          <div class="ref-hint">Entered automatically if you arrived via an invite link.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></div>
    </div>
  </div>

  <script src="/assets/js/notifications.js"></script>
  <script type="module">
    import { supabase } from '/assets/js/apm-client.js';

    // Pre-fill referral code from ?ref=CODE
    const urlRef = new URLSearchParams(location.search).get('ref');
    if (urlRef) document.getElementById('referral-code').value = urlRef.toUpperCase();

    // Already signed in? Skip
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = '/dashboard.html';

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch spinner"></i> Creating account...';

      const fullName = document.getElementById('full-name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const referralCode = document.getElementById('referral-code').value.trim().toUpperCase();

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName, referral_code: referralCode || null }
        }
      });

      if (error) {
        showToast(error.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        return;
      }

      if (data.session) {
        // Email confirmation disabled → straight in
        showToast('Account created! Welcome to APM 🎉', 'gold');
        setTimeout(() => window.location.href = '/dashboard.html', 800);
      } else {
        // Email confirmation enabled
        document.querySelector('.auth-card').innerHTML = `
          <div class="auth-logo"><span class="coin">A</span> APM<span class="bolt">⚡</span></div>
          <div class="auth-title">Check your email 📬</div>
          <div class="auth-sub">We sent a confirmation link to <b class="mint">${email}</b>.<br>Confirm it, then sign in to start earning.</div>
          <a href="/login.html" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i> Go to Sign In</a>
        `;
      }
    });
  </script>
</body>
</html>
